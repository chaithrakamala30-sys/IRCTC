services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RAILCONNECT_DB_NAME:?Copy .env.example to .env and set database values}
      POSTGRES_USER: ${RAILCONNECT_DB_USERNAME:?Set RAILCONNECT_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${RAILCONNECT_DB_PASSWORD:?Set a local-only RAILCONNECT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - railconnect

  backend:
    build:
      context: ./backend/railconnect-core
      dockerfile: ../../infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      RAILCONNECT_DB_URL: ${RAILCONNECT_COMPOSE_DB_URL:-jdbc:postgresql://db:5432/railconnect}
      RAILCONNECT_DB_SCHEMA: ${RAILCONNECT_DB_SCHEMA:-railconnect}
      RAILCONNECT_DB_USERNAME: ${RAILCONNECT_DB_USERNAME:?Set RAILCONNECT_DB_USERNAME in .env}
      RAILCONNECT_DB_PASSWORD: ${RAILCONNECT_DB_PASSWORD:?Set RAILCONNECT_DB_PASSWORD in .env}
      RAILCONNECT_CORS_ALLOWED_ORIGINS: ${RAILCONNECT_CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003}
      RAILCONNECT_REDIS_ENABLED: ${RAILCONNECT_REDIS_ENABLED:-false}
      RAILCONNECT_REDIS_HOST: ${RAILCONNECT_REDIS_HOST:-redis}
      RAILCONNECT_REDIS_PORT: ${RAILCONNECT_REDIS_PORT:-6379}
      RAILCONNECT_REDIS_USERNAME: ${RAILCONNECT_REDIS_USERNAME:-}
      RAILCONNECT_REDIS_PASSWORD: ${RAILCONNECT_REDIS_PASSWORD:-}
      RAILCONNECT_REDIS_SSL: ${RAILCONNECT_REDIS_SSL:-false}
      RAILCONNECT_REDIS_TIMEOUT_MS: ${RAILCONNECT_REDIS_TIMEOUT_MS:-1000}
      RAILCONNECT_REDIS_CONNECT_TIMEOUT_MS: ${RAILCONNECT_REDIS_CONNECT_TIMEOUT_MS:-1000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    networks:
      - railconnect

  passenger-web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        APP_WORKSPACE: "@railconnect/passenger-web"
        APP_PATH: "apps/passenger-web"
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - railconnect

  admin-portal:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        APP_WORKSPACE: "@railconnect/admin-portal"
        APP_PATH: "apps/admin-portal"
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - railconnect

  operations-portal:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        APP_WORKSPACE: "@railconnect/operations-portal"
        APP_PATH: "apps/operations-portal"
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - railconnect

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - railconnect

volumes:
  postgres-data:

networks:
  railconnect:
    driver: bridge
