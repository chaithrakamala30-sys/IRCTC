spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: RailConnect Core
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  datasource:
    url: ${RAILCONNECT_DB_URL:jdbc:postgresql://localhost:54329/railconnect}
    username: ${RAILCONNECT_DB_USERNAME}
    password: ${RAILCONNECT_DB_PASSWORD}
    hikari:
      pool-name: railconnect-pool
      schema: ${RAILCONNECT_DB_SCHEMA:railconnect}
      maximum-pool-size: ${RAILCONNECT_DB_POOL_SIZE:5}
      minimum-idle: ${RAILCONNECT_DB_MIN_IDLE:0}
      connection-timeout: ${RAILCONNECT_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${RAILCONNECT_DB_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${RAILCONNECT_DB_MAX_LIFETIME_MS:1500000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${RAILCONNECT_DB_SCHEMA:railconnect}
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${RAILCONNECT_DB_SCHEMA:railconnect}
    default-schema: ${RAILCONNECT_DB_SCHEMA:railconnect}
    create-schemas: true
    validate-on-migrate: true
  data:
    redis:
      host: ${RAILCONNECT_REDIS_HOST:localhost}
      port: ${RAILCONNECT_REDIS_PORT:6379}
      username: ${RAILCONNECT_REDIS_USERNAME:}
      password: ${RAILCONNECT_REDIS_PASSWORD:}
      ssl:
        enabled: ${RAILCONNECT_REDIS_SSL:false}
      timeout: ${RAILCONNECT_REDIS_TIMEOUT_MS:1000}
      connect-timeout: ${RAILCONNECT_REDIS_CONNECT_TIMEOUT_MS:1000}
      repositories:
        enabled: false
  mvc:
    problemdetails:
      enabled: false
  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: RCSESSION
        http-only: true
        secure: ${RAILCONNECT_SESSION_COOKIE_SECURE:false}
        same-site: lax
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
    connection-timeout: 5s
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

railconnect:
  search:
    maximum-days: ${RAILCONNECT_SEARCH_MAX_DAYS:365}
  fares:
    quote-validity: ${RAILCONNECT_FARE_QUOTE_VALIDITY:PT10M}
  pay:
    requests-per-minute: ${RAILCONNECT_PAY_REQUESTS_PER_MINUTE:6}
    dhruva-bank:
      enabled: ${RAILCONNECT_PAY_DHRUVA_BANK_ENABLED:false}
      base-url: ${RAILCONNECT_PAY_DHRUVA_BANK_BASE_URL:https://dhruva-bank.vercel.app}
      api-key: ${RAILCONNECT_PAY_DHRUVA_BANK_API_KEY:}
      api-secret: ${RAILCONNECT_PAY_DHRUVA_BANK_API_SECRET:}
      passenger-origin: ${RAILCONNECT_PAY_PASSENGER_ORIGIN:https://irctc-rho.vercel.app}
  reservations:
    maximum-passengers-per-request: ${RAILCONNECT_RESERVATION_MAX_PASSENGERS:4}
    requests-per-minute: ${RAILCONNECT_RESERVATION_REQUESTS_PER_MINUTE:10}
    expiration-sweep-ms: ${RAILCONNECT_RESERVATION_EXPIRATION_SWEEP_MS:30000}
  redis:
    enabled: ${RAILCONNECT_REDIS_ENABLED:false}
  supabase:
    url: ${RAILCONNECT_SUPABASE_URL:}
    anon-key: ${RAILCONNECT_SUPABASE_ANON_KEY:}
    service-role-key: ${RAILCONNECT_SUPABASE_SERVICE_ROLE_KEY:}
  security:
    max-request-body-bytes: ${RAILCONNECT_MAX_REQUEST_BODY_BYTES:1048576}
    absolute-session-timeout: ${RAILCONNECT_ABSOLUTE_SESSION_TIMEOUT:8h}
    login-throttle-key: ${RAILCONNECT_AUTH_THROTTLE_KEY:}
    cors:
      allowed-origins: ${RAILCONNECT_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002,http://localhost:3003}

springdoc:
  api-docs:
    enabled: ${RAILCONNECT_OPENAPI_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${RAILCONNECT_OPENAPI_ENABLED:true}
  packages-to-scan: in.railconnect.core

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: railconnect-core

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    org.springframework.security: WARN
