name: Backend checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railconnect_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d railconnect_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      RAILCONNECT_DB_URL: jdbc:postgresql://localhost:5432/railconnect_test
      RAILCONNECT_DB_USERNAME: postgres
      RAILCONNECT_DB_PASSWORD: postgres
      RAILCONNECT_REDIS_ENABLED: "false"
      RAILCONNECT_CORS_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:3002,http://localhost:3003
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify backend and PostgreSQL migration
        working-directory: backend/railconnect-core
        run: mvn --batch-mode --no-transfer-progress verify
