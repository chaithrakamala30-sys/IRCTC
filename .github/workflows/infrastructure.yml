name: Infrastructure checks

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "infrastructure/**"
      - ".env.example"
      - ".github/workflows/infrastructure.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "infrastructure/**"
      - ".env.example"
      - ".github/workflows/infrastructure.yml"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/^RAILCONNECT_DB_USERNAME=.*/RAILCONNECT_DB_USERNAME=ci_user/' .env
          sed -i 's/^RAILCONNECT_DB_PASSWORD=.*/RAILCONNECT_DB_PASSWORD=ci_password/' .env
          docker compose config --quiet
      - name: Build backend container
        run: docker build -f infrastructure/docker/backend.Dockerfile backend/railconnect-core
      - name: Build frontend containers
        shell: bash
        run: |
          set -euo pipefail
          for app in passenger-web admin-portal operations-portal; do
            docker build \
              -f infrastructure/docker/frontend.Dockerfile \
              --build-arg "APP_WORKSPACE=@railconnect/${app}" \
              --build-arg "APP_PATH=apps/${app}" \
              --build-arg "NEXT_PUBLIC_API_BASE_URL=http://localhost:8080" \
              .
          done
