name: Infrastructure checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "infrastructure/**"
      - ".env.example"
      - ".github/workflows/infrastructure.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "infrastructure/**"
      - ".env.example"
      - ".github/workflows/infrastructure.yml"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/^RAILCONNECT_DB_USERNAME=.*/RAILCONNECT_DB_USERNAME=ci_user/' .env
          sed -i 's/^RAILCONNECT_DB_PASSWORD=.*/RAILCONNECT_DB_PASSWORD=ci_password/' .env
          docker compose config --quiet
      - name: Start Docker Compose stack
        run: |
          docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify API health and documentation
        run: |
          curl --fail --retry 12 --retry-delay 5 http://localhost:8080/api/v1/health/readiness
          curl --fail http://localhost:8080/api/v1/health/liveness
          curl --fail http://localhost:8080/v3/api-docs
          curl --fail http://localhost:8080/swagger-ui.html
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes
